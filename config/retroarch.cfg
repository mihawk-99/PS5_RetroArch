# PS5 RetroArch - the configuration the title starts from.
#
# This file is the seed: the build copies it into the title folder as
# retroarch.cfg, and the title's arguments point RetroArch at it
# (src/main.cpp: -c /app0/retroarch.cfg). RetroArch rewrites it as settings
# change, so this copy is the starting state, not the live one.
#
# video_driver is the one setting here that matters today.
#
#   ps5     this project's own driver (src/video_ps5.cpp), which presents
#           through the console's VideoOut display layer. It initialises and
#           the title stays up, but nothing it submits reaches the screen -
#           measured over many runs, see docs/FINDINGS.md.
#
#   vulkan  RetroArch's own Vulkan driver, which needs this project's ICD at
#           libvulkan.so.1 beside the title (LD_LIBRARY_PATH points at the
#           title's own folder). That library is ../PS5_Vulkan's libps5vk.
#           Until it is present, naming vulkan here makes RetroArch fail to
#           initialise and the title exits with status 1, which is worse than
#           a black screen because it says nothing about the menu.
#
# So the safe value is named until the library is beside the title. Change this
# one line, or the file on the console, to switch paths.
video_driver = "ps5"

# Quiet by default; the title passes --verbose for runs that are being read.
log_verbosity = false

# The console has no window to be fullscreen in, and no desktop to hide from.
video_fullscreen = true
pause_nonactive = false
