# PS5 RetroArch - the configuration the title starts from.
#
# This file is the seed: the build copies it into the title folder as
# retroarch.cfg, and the title's arguments point RetroArch at it
# (src/main.cpp: -c /app0/retroarch.cfg). RetroArch rewrites it as settings
# change, so this copy is the starting state, not the live one.
#
# video_driver is the one setting here that matters today.
#
#   ps5     this project's own driver (src/video_ps5.cpp), which presents
#           through the console's VideoOut display layer. It initialises and
#           the title stays up, but nothing it submits reaches the screen -
#           measured over many runs, see docs/FINDINGS.md.
#
#   vulkan  RetroArch's own Vulkan driver, which needs this project's ICD at
#           libvulkan.so.1 beside the title (LD_LIBRARY_PATH points at the
#           title's own folder). That library is ../PS5_Vulkan's libps5vk.
#           Until it is present, naming vulkan here makes RetroArch fail to
#           initialise and the title exits with status 1, which is worse than
#           a black screen because it says nothing about the menu.
#
# So the safe value is named until the library is beside the title. Change this
# one line, or the file on the console, to switch paths.
video_driver = "ps5"

# Quiet by default; the title passes --verbose for runs that are being read.
# Verbosity is what fills the log below. The entry point also passes
# --verbose; the two agree, and this is the one a user can change without
# a rebuild.
log_verbosity = true

# The console has no window to be fullscreen in, and no desktop to hide from.
video_fullscreen = true
pause_nonactive = false

# The console's own pad, through this project's input driver (src/input_ps5.cpp).
#
# "ps5" is the only input driver this build can use: every driver upstream ships
# for a Unix needs a library or a header the payload SDK does not carry, and the
# null driver reports nothing at all, which is what made the menu unreachable.
# Naming it here is what puts input_drivers[0] in front of the frontend's input
# path; without it RetroArch picks whatever it finds first, and finds nothing.
input_driver = "ps5"

# The input driver reads the pad itself, so the joypad abstraction - which has no
# driver at all in this build, and whose absence is what patches/series 0004
# guards - is left unnamed rather than pointed at a driver that does not exist.
input_joypad_driver = ""

# RetroArch's own log, written beside the title. It is worth having on for every
# run: the kernel log cannot see inside the frontend, and /app0/trace.txt only
# carries the lines this project remembers to write. The file lands in /app0 as
# retroarch__<date>__<time>.log while log_to_file_timestamp is false, so the
# newest one is unambiguous.
#
# These three are inert today, and the reason is worth keeping: RetroArch
# initialises the file logger *after* it parses its config, and this title's config
# is not being read yet - content loading discards the -c argument, and the fix for
# that is parked because reading the config still crashes the launch. They are here
# so that the day the config is read, the log appears without anyone remembering.
log_to_file = true
log_to_file_timestamp = false
log_dir = "/app0"

# Verbosity is what fills that file. The entry point also passes --verbose; the
# two agree, and this one is the setting a user can change without a rebuild.
