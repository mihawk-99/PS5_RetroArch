# PS5 RetroArch seed configuration.
# Installed once as /app0/config/retroarch.cfg by the native frontend.
# Updates replace this packaged seed, but preserve the live configuration.

# GPU video and XMB menu are the default; ps5 video and RGUI remain registered.
video_driver = "vulkan"
menu_driver = "xmb"
assets_directory = "/app0/assets"

video_fullscreen = true
# 120 Hz where the display offers it (sce_sys/param.json declares it, and the
# driver selects it), 60 Hz where it does not: the display context sets the
# refresh from the mode it gets, and an automatic swap interval keeps a 60 FPS
# core at its speed on a 120 Hz output (patches 0084/0085).
video_refresh_rate = "119.880000"
video_swap_interval = "0"
pause_nonactive = false

# Native input and joypad backend (buttons, analog navigation and bindings).
input_driver = "ps5"
input_joypad_driver = "ps5"

# Preserve frontend/core/menu diagnostics during development.
# The port explicitly initializes this logger after config processing as well.
log_verbosity = true
log_to_file = true
log_to_file_timestamp = false
log_dir = "/app0"

# Native stereo PCM output; RetroArch resamples to the device rate.
audio_driver = "ps5"
audio_out_rate = "48000"
